aid: icardioai
name: Icardio.AI
description: >-
  Icardio.AI (iCardio.ai) builds artificial-intelligence software that automates
  the interpretation of cardiac ultrasound (echocardiography). Its FDA 510(k)-cleared
  products include EchoMeasure, which identifies cardiac phases and automatically
  measures anatomical structures to produce comprehensive echo reports, and
  CardioVision, which automatically detects aortic stenosis and structural heart
  disease from ultrasound clips (also granted FDA Breakthrough Device Designation).
  Additional tooling includes EchoCheck image-quality and view classification,
  quantitative linear and volumetric measurements, qualitative structural-disease
  analysis, and EchoGPT image-to-text description. The company trains on a database
  of 200M+ echocardiography images and partners with ultrasound manufacturers,
  PACS vendors, and healthcare systems, offering API integration into enterprise
  PACS workflows. Icardio.AI is a Techstars portfolio company.
